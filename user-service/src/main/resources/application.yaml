server:
  port: 9003
  servlet:
    context-path: /user-service

spring:
  application:
    name: USER-SERVICE
  config:
    import: optional:configserver:http://localhost:9001

logging:
  file:
    name: user-service.log
    path: .//

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:9002/eureka
